<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onnivation · Partnership Command Center</title><style>
:root{--green:#174c3e;--dark:#143c33;--mint:#e9f4ef;--text:#172a27;--sub:#71807b;--edge:#e5eae7;--bg:#f7f9f7;--red:#ba4e43;--blue:#3765b0;--shadow:0 8px 36px #1633260a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--edge);padding:27px 17px;display:flex;flex-direction:column;gap:30px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:0 12px}.brandmark{background:var(--green);color:white;height:38px;width:38px;display:grid;place-items:center;border-radius:12px;font-size:25px;font-weight:600}.brand strong{font-size:18px;letter-spacing:-.5px}.brand small{display:block;color:var(--sub);font-size:10px;text-transform:uppercase;letter-spacing:1.6px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#53665e;text-align:left;padding:13px 16px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:14px}.nav button:hover{background:#f5f8f5}.nav button.active{color:var(--green);background:#ecf4ef;font-weight:700}.nav .ico{font-size:19px;width:22px;text-align:center}.sidestatus{margin-top:auto;border:1px solid var(--edge);padding:14px;border-radius:12px;color:var(--sub);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#d09f54;margin-right:8px}.dot.live{background:#27875c}.main{min-width:0;padding:35px clamp(24px,4vw,68px) 100px;max-width:1660px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:34px}.eyebrow{font-size:11px;color:#87958b;letter-spacing:1.6px;text-transform:uppercase;font-weight:800}.top h1{margin:3px 0 0;font-size:29px;letter-spacing:-1.3px;line-height:1.2;font-weight:720}.topright{display:flex;align-items:center;gap:10px}.btn{padding:11px 16px;border:1px solid #dce4de;border-radius:10px;background:white;color:#29433a;font-weight:650;display:inline-flex;align-items:center;gap:8px;justify-content:center}.btn:hover{background:#f4f8f5}.btn.primary{background:var(--green);color:white;border-color:var(--green)}.btn.primary:hover{background:#123b31}.btn.sm{padding:6px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}.notice{padding:13px 16px;border-radius:11px;background:#fff7e8;border:1px solid #f0e2c4;color:#755b30;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.notice.success{background:#e7f5ee;border-color:#d4e8db;color:#245c43}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{background:#fff;border:1px solid var(--edge);border-radius:14px;padding:22px;box-shadow:var(--shadow)}.stat small{font-size:12px;color:#718078;font-weight:600}.stat .num{font-size:34px;font-weight:730;letter-spacing:-1.5px;margin-top:8px}.stat footer{color:#8b9990;font-size:11px;margin-top:5px}.section{margin-top:30px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:15px}.section-head h2{font-size:17px;letter-spacing:-.4px;margin:0}.section-head .sub{color:var(--sub);font-size:12px}.panel{background:white;border:1px solid var(--edge);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.layout2{display:grid;grid-template-columns:1.3fr .7fr;gap:18px}.table{width:100%;border-collapse:collapse;text-align:left}.table thead{background:#fbfcfb;color:#87938e;font-size:11px;text-transform:uppercase;letter-spacing:.6px}.table th,.table td{padding:14px 17px;border-bottom:1px solid #eff2ef;vertical-align:middle}.table tr:last-child td{border:0}.table tbody tr:hover{background:#fbfdfc}.table strong{font-weight:660}.muted{color:var(--sub)}.small{font-size:12px}.pill{font-size:11px;white-space:nowrap;padding:5px 9px;border-radius:100px;display:inline-flex;align-items:center;font-weight:700;gap:5px}.pill.red{color:#a9483c;background:#fbeeed}.pill.blue{color:#3a65ae;background:#edf2fa}.pill.grey{color:#53645d;background:#f1f3f1}.pill.orange{color:#9c6736;background:#fcf0df}.pill.green{color:#25764d;background:#e8f5ea}.action{border:0;background:transparent;text-align:left;color:var(--green);font-weight:700}.search{border:1px solid var(--edge);background:white;outline:none;border-radius:9px;padding:10px 13px;min-width:245px}.search:focus,select:focus,input:focus,textarea:focus{border-color:#72aa90;outline:2px solid #b6ddc76e}select{background:white;border:1px solid var(--edge);border-radius:8px;padding:8px 9px;color:#42584e;max-width:180px}.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.kanban{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}.lane{border:1px solid #e8edea;border-radius:14px;background:#f2f5f2;padding:13px;min-height:300px}.lane .lanehead{display:flex;justify-content:space-between;font-weight:700;padding:6px 5px 14px}.ticket{padding:17px;background:white;border:1px solid #e3e9e5;border-radius:11px;margin:0 0 10px;box-shadow:0 3px 12px #263c2a06;cursor:grab}.ticket:hover{border-color:#b6d0bf}.ticket p{font-size:12px;line-height:1.6;color:var(--sub);margin:8px 0 12px}.ticket select{font-size:12px;max-width:100%;width:100%}.ticket .tfooter{display:flex;justify-content:space-between;align-items:center}.ticket .tfooter small{color:#a2aba4}.drop{border:2px dashed #8fb5a0}.fileicon{width:37px;height:42px;background:#f5eeed;display:grid;place-items:center;border-radius:6px;color:#bb6a5c;font-size:11px;font-weight:800}.filecell{display:flex;align-items:center;gap:12px;max-width:350px}.filecell .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:650}.filecell small{display:block;color:#94a099}.empty{padding:50px 20px;text-align:center;color:var(--sub)}.activity{padding:6px 20px}.activityitem{padding:15px 5px;border-bottom:1px solid var(--edge)}.activityitem:last-child{border:0}.activityitem small{color:#97a39c}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--edge);margin-bottom:20px}.tabs button{border:0;background:none;color:var(--sub);padding:11px 15px;border-bottom:2px solid transparent}.tabs .on{color:var(--green);border-bottom-color:var(--green);font-weight:700}.modalshade{position:fixed;inset:0;background:#1021198c;display:grid;place-items:center;z-index:20;padding:20px}.modal{background:#fff;border-radius:18px;width:min(620px,100%);padding:30px;max-height:95vh;overflow:auto;box-shadow:0 20px 80px #1025193d}.modal h2{margin:0 0 6px;font-size:23px;letter-spacing:-.6px}.modal .explain{color:var(--sub);font-size:13px;margin:0 0 23px}.formgrid{display:grid;gap:15px}.field{display:grid;gap:6px}.field label{font-weight:650;font-size:12px}.field input,.field select,.field textarea{width:100%;max-width:100%;padding:11px;border:1px solid var(--edge);border-radius:9px;background:white}.field textarea{min-height:74px}.uploader{padding:35px 20px;text-align:center;border:2px dashed #b8d1c2;border-radius:13px;background:#f7faf7;cursor:pointer}.uploader strong{display:block;color:var(--green);margin-top:8px}.uploader small{color:var(--sub)}.modalfooter{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.clause{padding:20px;border-bottom:1px solid var(--edge)}.clause:last-child{border:0}.clausecols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:13px}.clausetext{white-space:pre-wrap;background:#f8faf8;border:1px solid var(--edge);padding:13px;border-radius:8px;max-height:220px;overflow:auto;font-size:12px;color:#4e5a54}.clausetext .ctitle{font-size:11px;color:#8e9b93;text-transform:uppercase;font-weight:700}.statusbox{padding:17px;border:1px solid var(--edge);border-radius:11px;background:white;margin:12px 0}.statusbox h3{margin:0 0 5px}.hint{padding:14px;background:#f6f9f5;border-radius:11px;color:#5e7468;font-size:12px}.gridsetup{display:grid;grid-template-columns:1fr 1fr;gap:18px}.link{color:#277354;text-decoration:none}.link:hover{text-decoration:underline}.nowrap{white-space:nowrap}.toast{position:fixed;bottom:22px;right:23px;background:#233f34;color:white;padding:14px 18px;border-radius:11px;box-shadow:var(--shadow);z-index:100;max-width:450px}.right{display:flex;align-items:center;gap:10px}.loading{opacity:.6}.mobilemenu{display:none}
@media(max-width:1100px){.layout2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:1fr}.gridsetup{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:13px;gap:12px}.nav{display:flex;overflow:auto}.nav button{flex-shrink:0;padding:9px}.sidestatus{display:none}.main{padding:24px 14px 60px}.top{align-items:flex-start}.top h1{font-size:24px}.topright .btn.secondary{display:none}.stats{gap:9px}.stat{padding:15px}.stat .num{font-size:28px}.table th,.table td{padding:10px}.table{font-size:12px}.search{min-width:0;width:100%}.clausecols{grid-template-columns:1fr}.modal{padding:20px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brandmark">◈</span><div><strong>Onnivation</strong><small>Partnerships</small></div></div><nav class="nav" id="nav"></nav><div class="sidestatus"><div><span class="dot" id="connectionDot"></span><strong id="connectionName">Checking connections</strong></div><div style="margin-top:7px">Changes are only live after both systems confirm.</div></div></aside><main class="main"><header class="top"><div><div class="eyebrow">Finance operations / Partner management</div><h1 id="pagetitle">Overview</h1></div><div class="topright"><button class="btn secondary" onclick="syncNow()">↻ Sync now</button><button class="btn primary" onclick="openUpload()">＋ Upload contract</button></div></header><div id="banner"></div><div id="content"></div></main></div><div id="modalroot"></div><div id="toastroot"></div><script>
const NAV=[['overview','◫','Overview'],['pipeline','▤','Partnership pipeline'],['contracts','▣','Contracts library'],['reviews','⚑','Contract reviews'],['activity','◷','Activity log'],['settings','⚙','Settings']];let state={partners:[],files:[],events:[],integrations:{},deviation_count:0,mode:'local',settings:{}};let page='overview',view='kanban',query='',queueFilter='all',selectedFile=null,loading=false;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const color=q=>q==='Saket review'?'blue':q==='On hold'?'red':q==='Signed'?'green':'grey';
const status=q=>`<span class="pill ${color(q)}">${q==='On hold'?'●':q==='Saket review'?'●':'○'} ${esc(q)}</span>`;
const endpoint=async(url,options={})=>{let r=await fetch(url,options);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||d.error||'Request failed');return d};
const post=(url,data)=>endpoint(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
function toast(m){document.getElementById('toastroot').innerHTML=`<div class="toast">${esc(m)}</div>`;setTimeout(()=>document.getElementById('toastroot').innerHTML='',5500)}
async function refresh(){try{state=await endpoint('/api/overview');render()}catch(e){toast('Unable to load: '+e.message)}}
function navigate(p){page=p;query='';render()}
function render(){document.getElementById('nav').innerHTML=NAV.map(([id,ico,title])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')"><span class="ico">${ico}</span>${title}</button>`).join('');document.getElementById('pagetitle').textContent=NAV.find(x=>x[0]===page)?.[2]||'Overview';let good=state.mode==='live';document.getElementById('connectionDot').className='dot'+(good?' live':'');document.getElementById('connectionName').textContent=good?'Sources connected':state.mode==='partial'?'Verification needed':state.mode==='demo'?'Demo records':'Local / not connected';document.getElementById('banner').innerHTML=state.mode!=='live'?`<div class="notice"><div><strong>${state.mode==='demo'?'Demo mode':state.mode==='local'?'Local drafts':'Connection check'}</strong> · This portal ${state.mode==='demo'?'shows sample records that are never published':state.mode==='local'?'stores local drafts until you connect your accounts':'has a connection that needs source verification'}. Status moves and uploads may remain local until Notion and Drive are authorised.</div><button class="btn sm" onclick="navigate('settings')">Set up →</button></div>`:'';document.getElementById('content').innerHTML=page==='overview'?overview():page==='pipeline'?pipeline():page==='contracts'?contracts():page==='reviews'?reviews():page==='activity'?activity():settings()}
function partnerActions(p){if(p.sync_state==='publishing')return `<button class="btn sm" onclick="resolvePartner('${p.id}')">Reconcile draft</button>`;return `<select title="Move work queue" onchange="move('${esc(p.id)}',this.value)"><option value="">Move to…</option>${['To pick up','Saket review','On hold'].filter(q=>q!==p.queue).map(q=>`<option value="${q}">${q}</option>`).join('')}</select>`}
function overview(){const n=q=>state.partners.filter(p=>p.queue===q).length;let pending=state.partners.filter(p=>p.sync_state==='pending').length;let action=state.partners.filter(p=>p.queue!=='On hold').slice(0,7);let docs=state.files.slice(0,5);return `<div class="stats"><div class="stat"><small>To pick up</small><div class="num">${n('To pick up')}</div><footer>Needs finance action</footer></div><div class="stat"><small>Saket review</small><div class="num">${n('Saket review')}</div><footer>Decisions required</footer></div><div class="stat"><small>On hold</small><div class="num">${n('On hold')}</div><footer>Paused partnerships</footer></div><div class="stat"><small>Clause reviews</small><div class="num">${state.deviation_count}</div><footer>Open review flags</footer></div></div><div class="layout2 section"><div><div class="section-head"><h2>Priority action queue</h2><button class="action" onclick="navigate('pipeline')">View all →</button></div><div class="panel"><table class="table"><thead><tr><th>Company</th><th>Work status</th><th>Next action</th></tr></thead><tbody>${action.map(p=>`<tr><td><strong>${esc(p.name)}</strong><div class="muted small">${esc(p.stage)}</div></td><td>${status(p.queue)}</td><td><span class="small">${esc(p.notes).slice(0,100)}</span></td></tr>`).join('')||'<tr><td colspan="3">No partners yet</td></tr>'}</tbody></table></div></div><div><div class="section-head"><h2>Recent documents</h2><button class="action" onclick="navigate('contracts')">Library →</button></div><div class="panel">${docs.map(f=>`<div style="padding:15px;border-bottom:1px solid var(--edge)"><strong>${esc(f.name)}</strong><div class="muted small">${esc(f.sync_state)} · ${esc(f.document_type)}</div></div>`).join('')||'<div class="empty">New contracts will appear here after upload</div>'}</div><div class="section-head" style="margin-top:24px"><h2>Connection health</h2></div><div class="panel" style="padding:18px"><div class="right" style="justify-content:space-between;margin-bottom:12px">Notion <span class="pill ${state.integrations.notion?'green':'orange'}">${state.integrations.notion_verified?'Verified':state.integrations.notion?'Connected · verify source':'Not connected'}</span></div><div class="right" style="justify-content:space-between">Google Drive <span class="pill ${state.integrations.google?'green':'orange'}">${state.integrations.google_verified?'Verified':state.integrations.google?'Connected · verify folder':'Not connected'}</span></div>${pending?`<div class="hint" style="margin-top:14px">${pending} local status changes require synchronization.</div>`:''}</div></div></div>`}
function filtered(){return state.partners.filter(p=>(queueFilter==='all'||p.queue===queueFilter)&&[p.name,p.notes,p.stage].join(' ').toLowerCase().includes(query.toLowerCase()))}
function pipeline(){const p=filtered();return `<div class="section-head"><div class="filterbar"><input class="search" value="${esc(query)}" placeholder="Search company or notes…" oninput="query=this.value;document.getElementById('pipelineBody').innerHTML=pipelineBody()"><select onchange="queueFilter=this.value;document.getElementById('pipelineBody').innerHTML=pipelineBody()"><option value="all">All work queues</option>${['To pick up','Saket review','On hold'].map(q=>`<option ${queueFilter===q?'selected':''}>${q}</option>`).join('')}</select></div><div class="right"><button class="btn sm ${view==='kanban'?'primary':''}" onclick="view='kanban';render()">▦ Board</button><button class="btn sm ${view==='table'?'primary':''}" onclick="view='table';render()">☷ List</button><button class="btn sm" onclick="newPartner()">＋ Partner</button></div></div><div id="pipelineBody">${pipelineBody()}</div>`}
function pipelineBody(){const p=filtered();if(view==='table')return `<div class="panel" style="overflow:auto"><table class="table"><thead><tr><th>Partner</th><th>Work status</th><th>Contract stage</th><th>Notes</th><th>Move</th></tr></thead><tbody>${p.map(x=>`<tr><td><strong>${esc(x.name)}</strong>${x.verification?' <span title="Source discrepancy">⚠</span>':''}</td><td>${status(x.queue)}</td><td><select onchange="changeStage('${x.id}',this.value)">${['Not received','NDA / LOI','With partner','Negotiating','For signature','Signed'].map(s=>`<option ${x.stage===s?'selected':''}>${s}</option>`).join('')}</select></td><td class="small muted">${esc(x.notes).slice(0,135)}</td><td>${partnerActions(x)}</td></tr>`).join('')}</tbody></table></div>`;return `<div class="kanban">${['To pick up','Saket review','On hold'].map(q=>`<div class="lane" data-queue="${q}" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="event.preventDefault();this.classList.remove('drop');const id=event.dataTransfer.getData('text/plain');if(id)move(id,'${q}')"><div class="lanehead"><span>${status(q)}</span><span class="muted">${p.filter(x=>x.queue===q).length}</span></div>${p.filter(x=>x.queue===q).map(x=>`<div class="ticket" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${x.id}')"><div class="right" style="justify-content:space-between"><strong>${esc(x.name)}</strong>${x.verification?'<span title="Original note conflict">⚠</span>':''}</div><p>${esc(x.notes).slice(0,155)||'No notes yet'}</p><div class="tfooter"><small>${esc(x.stage)}</small></div><div style="margin-top:12px">${partnerActions(x)}</div></div>`).join('')||'<div class="empty" style="padding:20px">Drop partner here</div>'}</div>`).join('')}</div>`}
async function move(id,queue){if(!queue)return;let p=state.partners.find(x=>x.id===id);if(!p||p.queue===queue)return;let prior=p.queue;let reason='';if(queue==='Saket review')reason='Decision required';try{let d=await post('/api/partners/'+id+'/move',{queue,reason});p.queue=queue;p.sync_state=d.sync_state;render();toast(d.sync_state==='live'?`${p.name} moved to ${queue} and saved to Notion`:`${p.name}: ${d.warning||'Saved locally; Notion pending'}`)}catch(e){toast('Move failed: '+e.message)}}
async function changeStage(id,stage){try{let d=await post('/api/partners/'+id+'/stage',{stage});toast(d.sync_state==='live'?'Stage saved to Notion':'Stage saved locally, Notion sync pending');await refresh()}catch(e){toast(e.message)}}
function contracts(){let fs=state.files.filter(f=>[f.name,state.partners.find(p=>p.id===f.partner_id)?.name||''].join(' ').toLowerCase().includes(query.toLowerCase()));return `<div class="section-head"><div class="filterbar"><input class="search" placeholder="Search contract or company…" value="${esc(query)}" oninput="query=this.value;render()"><div class="muted small">${fs.length} files</div></div><button class="btn" onclick="openUpload()">＋ Add a document</button></div><div class="panel" style="overflow-x:auto"><table class="table"><thead><tr><th>Document</th><th>Company</th><th>Sync status</th><th>Added</th><th>Actions</th></tr></thead><tbody>${fs.map(f=>`<tr><td><div class="filecell"><span class="fileicon">${f.name.toLowerCase().endsWith('.pdf')?'PDF':'DOC'}</span><span><span class="fname" title="${esc(f.name)}">${esc(f.name)}</span><small>${esc(f.document_type)} · ${esc(f.source)}</small></span></div></td><td>${esc(state.partners.find(p=>p.id===f.partner_id)?.name||'Unmatched')}</td><td><span class="pill ${f.sync_state==='synced'||f.sync_state==='indexed'?'green':'orange'}">${esc(f.sync_state)}</span></td><td class="small muted nowrap">${esc((f.created||'').slice(0,10))}</td><td class="nowrap"><button class="action" onclick="openReview('${f.id}')">Review</button>${f.drive_url?` &nbsp; <a class="link" href="${esc(f.drive_url)}" target="_blank" rel="noopener">Drive ↗</a>`:''}${f.source==='portal'&&f.sync_state!=='synced'?f.sync_state==='drive_uncertain'||f.sync_state==='drive_uploading'?` &nbsp; <button class="action" onclick="resolveUpload('${f.id}')">Reconcile upload</button>`:` &nbsp; <button class="action" onclick="retryUpload('${f.id}')">Retry sync</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">No contracts loaded. Connect Google Drive and click Sync now, or upload a document.</div></td></tr>'}</tbody></table></div>`}
function reviews(){return `<div class="section-head"><h2>Clause exceptions and approvals</h2><div class="muted small">Only evidence-backed issues should be marked contested</div></div><div class="panel"><div style="padding:24px"><p class="muted">Open a contract to see extracted source clauses beside Onnivation’s standard wording, record decisions, and preserve audit history.</p><button class="btn" onclick="navigate('contracts')">Go to contracts →</button></div></div><div class="section"><div class="section-head"><h2>What gets checked</h2></div><div class="panel" style="padding:20px"><div class="gridsetup">${['Commission & revenue basis','Termination commission tail','Customer ownership & non-circumvention','Renewals, upsells and cross-sells','Territory and account registration','Non-payment protection','Indemnity & liability','Product change notice'].map(t=>`<div style="border-bottom:1px solid var(--edge);padding:10px">✓ ${t}</div>`).join('')}</div></div></div>`}
function activity(){return `<div class="section-head"><h2>Change history</h2><div class="muted small">Previous status, new status, action and timestamp</div></div><div class="panel activity">${state.events.map(e=>`<div class="activityitem"><strong>${esc(e.partner||'Company')}</strong> · ${esc(e.action)}<p class="muted small" style="margin:5px 0">${esc(e.detail)}</p><small>${esc(e.created)} · ${esc(e.actor)}</small></div>`).join('')||'<div class="empty">Status movements and uploads will appear here.</div>'}</div>`}
function settings(){const n=state.integrations.notion_status||{},g=state.integrations.google_status||{},c=state.settings||{};const box=(provider,title,status,description)=>`<div class="statusbox"><div class="right" style="justify-content:space-between"><h3>${title}</h3><span class="pill ${status.verified?'green':'orange'}">${status.verified?'Verified':status.connected?'Connected · verify source':'Not connected'}</span></div><p class="muted small">${description}</p>${status.workspace?`<p class="small">Workspace: ${esc(status.workspace)}</p>`:''}<div class="right"><button class="btn sm" onclick="connectAccount('${provider}')">${status.connected?'Reconnect':'Connect'} ${title}</button>${status.connected?`<button class="action" onclick="disconnectAccount('${provider}')">Disconnect</button>`:''}</div>${status.error?`<p class="small muted">${esc(status.error)}</p>`:''}<p class="small muted">Last refresh: ${esc((provider==='notion'?state.integrations.notion_last_sync:state.integrations.drive_last_sync)||'Never')}</p></div>`;return `<div class="section-head"><h2>Account connections</h2><button class="btn" onclick="syncNow()">↻ Refresh & verify sources</button></div><div class="gridsetup">${box('notion','Notion',n,'Sign in and authorise access to the partnership database.')}${box('google','Google Drive',g,'Sign in with an account that can read contracts and add files to the upload folder.')}</div><div class="section"><div class="section-head"><h2>Choose your sources</h2></div><form class="panel formgrid" style="padding:20px" onsubmit="saveSources(event)"><div class="field"><label for="notionSource">Notion data source ID or collection URL</label><input id="notionSource" required value="${esc(c.notion_data_source_id||'')}"></div><div class="field"><label for="driveSource">Contracts folder URL or ID</label><input id="driveSource" required value="${esc(c.drive_folder_id||'')}"></div><div class="field"><label for="uploadSource">Upload folder URL or ID</label><input id="uploadSource" required value="${esc(c.upload_folder_id||'')}"></div><div class="right"><button class="btn primary">Save sources</button>${state.hosted?'':`<button class="btn" type="button" onclick="publishDrafts()">Publish pending drafts</button>`}</div><p class="small muted">${state.hosted?'Changes are saved directly to Notion. Refresh reads the latest source data.':'Refresh only reads your sources. Publishing sends pending partner changes to Notion. Demo records are never published.'}</p></form></div>`}
async function connectAccount(provider){try{let d=await post('/api/connections/'+provider+'/start',{});window.location.assign(d.authorization_url)}catch(e){toast(e.message)}}
async function disconnectAccount(provider){if(!confirm('Disconnect this account from the shared finance portal?'))return;try{await post('/api/connections/'+provider+'/disconnect',{});await refresh();toast('Portal connection removed')}catch(e){toast(e.message)}}
async function saveSources(e){e.preventDefault();try{await post('/api/settings',{notion_data_source_id:document.getElementById('notionSource').value,drive_folder_id:document.getElementById('driveSource').value,upload_folder_id:document.getElementById('uploadSource').value});await refresh();toast('Sources saved. Refresh to verify access.')}catch(err){toast(err.message)}}
async function publishDrafts(){if(!confirm('Publish pending real partner drafts and status changes to the selected Notion source?'))return;try{let d=await post('/api/partners/publish-pending',{});await refresh();let failures=d.results.filter(r=>!r.success);toast(d.results.length?failures.length?failures.map(r=>r.partner+': '+r.error).join(' · '):'Pending drafts saved and verified in Notion':'No pending drafts to publish')}catch(e){toast(e.message)}}
async function resolvePartner(pid){let id=prompt('Inspect Notion. If this partner was created, paste its page URL or ID to verify and reconcile the draft.');if(!id)return;try{await post('/api/partners/'+pid+'/resolve',{notion_id:id});await refresh();toast('Existing Notion partner verified; no duplicate created')}catch(e){toast(e.message)}}
async function resolveUpload(fid){let id=prompt('Inspect the upload folder. If this contract is already there, paste its Drive file ID to verify and link it without uploading again.');if(!id)return;try{let d=await post('/api/files/'+fid+'/resolve',{drive_id:id});await refresh();toast(d.success?'Existing Drive file verified and linked':d.warnings.join(' '))}catch(e){toast(e.message)}}
function modal(inner){document.getElementById('modalroot').innerHTML=`<div class="modalshade" onclick="if(event.target===this)closeModal()"><div class="modal">${inner}</div></div>`}function closeModal(){document.getElementById('modalroot').innerHTML=''}
function openUpload(){modal(`<h2>Upload a contract</h2><p class="explain">One upload, automatically filed to Drive and linked to its Notion partnership when connections are active.</p><form id="uploadForm" class="formgrid" onsubmit="submitUpload(event)"><div class="uploader" onclick="document.getElementById('uploadFile').click()" ondragover="event.preventDefault()" ondrop="event.preventDefault();document.getElementById('uploadFile').files=event.dataTransfer.files;showFilename()"><div style="font-size:27px">⇧</div><strong id="chosenFile">Click to select or drop PDF / DOCX</strong><small>Up to 20 MB. Existing Drive files remain untouched.</small></div><input style="display:none" required type="file" id="uploadFile" accept=".pdf,.docx" onchange="showFilename()"><div class="field"><label>Partner company</label><select id="upPartner" required><option value="">Select the right partner…</option>${state.partners.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Agreement type</label><select id="docType"><option>Reseller agreement</option><option>LOI</option><option>NDA</option><option>Other agreement</option></select></div><div class="field"><label>Version note (optional)</label><input id="upNote" placeholder="e.g. Partner redlines received"></div><div class="modalfooter"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="upBtn">Upload & analyse</button></div></form>`)}
function showFilename(){document.getElementById('chosenFile').textContent=document.getElementById('uploadFile').files[0]?.name||'Choose file'}
async function submitUpload(e){e.preventDefault();let f=document.getElementById('uploadFile').files[0];if(!f)return toast('Select file first');let b=document.getElementById('upBtn');b.disabled=true;b.textContent='Uploading…';let hostedUploadId='';let data=new FormData();data.append('file',f);data.append('partner_id',document.getElementById('upPartner').value);data.append('document_type',document.getElementById('docType').value);data.append('note',document.getElementById('upNote').value);try{let r;if(state.hosted){if(f.size>20*1024*1024)throw Error('20 MB upload limit');let start=await post('/api/upload/start',{name:f.name,size:f.size,partner_id:data.get('partner_id'),document_type:data.get('document_type'),note:data.get('note')});hostedUploadId=start.id;for(let part=0;part<Math.ceil(f.size/start.chunk_size);part++){let bytes=f.slice(part*start.chunk_size,Math.min(f.size,(part+1)*start.chunk_size));await endpoint(`/api/upload/${start.id}/chunk/${part}`,{method:'POST',body:bytes});b.textContent=`Uploading ${Math.min(100,Math.round((part+1)*start.chunk_size/f.size*100))}%…`}b.textContent='Filing in Drive…';r=await post(`/api/upload/${start.id}/complete`,{})}else r=await endpoint('/api/upload',{method:'POST',body:data});closeModal();await refresh();toast(r.duplicate?'Already recorded, no duplicate upload':`Document saved: ${r.status}. ${(r.warnings||[]).join(' ')}`);if(!r.duplicate&&r.file)openReview(r.file.id)}catch(err){if(state.hosted&&hostedUploadId&&err.message.includes('uncertain')){let id=prompt('Inspect the upload folder. If the file is present, paste its Drive file ID to verify it before retrying.');if(id){try{let resolved=await post('/api/upload/'+hostedUploadId+'/resolve',{drive_id:id});closeModal();await refresh();toast('Existing Drive file verified and linked');if(resolved.file)openReview(resolved.file.id);return}catch(reconcileError){toast(reconcileError.message)}}}toast(err.message);b.disabled=false;b.textContent='Upload & analyse'}}
async function newPartner(){modal(`<h2>Add partner</h2><p class="explain">${state.hosted?'Add a partner directly to the connected Notion source.':'Add a partner to the connected Notion source, or save a local draft until connected.'}</p><div class="field"><label>Company name</label><input id="newName" placeholder="Partner company"></div><div class="modalfooter"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createPartner()">Add partner</button></div>`)}
async function createPartner(){let name=document.getElementById('newName').value.trim();if(!name)return;try{let r=await post('/api/partners',{name});closeModal();await refresh();toast(r.existing?'Partner exists':r.partner.sync_state==='live'?'Partner created in Notion':r.warning||'Partner saved as a local draft')}catch(e){toast(e.message)}}
async function openReview(fid){selectedFile=fid;try{let r=await endpoint('/api/files/'+fid+'/review');modal(`<div class="right" style="justify-content:space-between"><div><h2>Contract review</h2><p class="explain">${esc(r.file.name)}</p></div><button class="btn sm" onclick="closeModal()">✕</button></div><div class="hint">Review suggestions are not legal conclusions. Clauses need human approval. ${r.file.drive_url?`<a href="${esc(r.file.drive_url)}" target="_blank" class="link">Open original file ↗</a>`:''}</div><div style="margin-top:14px;max-height:60vh;overflow:auto">${r.deviations.map(d=>`<div class="clause"><div class="right" style="justify-content:space-between"><strong>${esc(d.subject)}</strong><span class="pill ${d.decision==='Approved exception'?'green':'orange'}">${esc(d.decision)}</span></div><div class="clausecols"><div><div class="eyebrow">Base language</div><div class="clausetext">${esc(d.base_text)}</div></div><div><div class="eyebrow">Partner language</div><div class="clausetext">${esc(d.partner_text)}</div></div></div><p class="small muted">${esc(d.explanation)}</p><div class="right"><button class="btn sm" onclick="decide('${d.id}','Approved exception')">Approve exception</button><button class="btn sm" onclick="decide('${d.id}','Negotiation requested')">Request negotiation</button></div></div>`).join('')||'<div class="empty">No review extracted yet. This may be a historical indexed file. Upload the contract through the portal to analyse it.</div>'}</div>`)}catch(e){toast('Review unavailable: '+e.message)}}
async function decide(id,decision){let reviewer=prompt('Reviewed by', 'Finance');if(reviewer===null)return;try{await post('/api/deviations/'+id+'/decision',{decision,reviewer});await refresh();openReview(selectedFile);toast('Review decision recorded')}catch(e){toast(e.message)}}
async function retryUpload(fid){try{let r=await post('/api/files/'+fid+'/retry',{});await refresh();toast(r.success?'Sync succeeded':'Still pending: '+r.warnings.join(' '))}catch(e){toast(e.message)}}
async function syncNow(){toast('Checking available connections…');try{let s=await post('/api/sync',{});await refresh();toast(['notion','drive'].map(k=>k+': '+(s[k].success?'synced':'not connected / error: '+s[k].error)).join(' · '))}catch(e){toast('Sync failed: '+e.message)}}
const callbackParams=new URLSearchParams(window.location.search);if(callbackParams.has('connected')||callbackParams.has('connection_error')){page='settings';history.replaceState({},'',window.location.pathname);setTimeout(()=>toast(callbackParams.get('connection_error')||'Account connected. Refresh to verify the selected sources.'),100)}
refresh();
</script></body></html>
